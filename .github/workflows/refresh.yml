name: refresh
# Monthly: download the current Census vintage of the six aggregate series (src/bullwhip/live.py),
# extend the live panel past the study window, rebuild the page, run the full gate, and commit
# only when files changed AND the gate passed. The 1993-2025 findings are frozen; this never
# touches data/raw or outputs/numbers.csv. A failed download or gate opens (or comments on) one
# issue and commits nothing. A Census revision that moves a 1993-2025 ratio opens its own issue.
on:
  schedule:
    - cron: "23 14 20 * *"  # the 20th, 14:23 UTC, after the monthly retail, wholesale and M3 releases
  workflow_dispatch:
    inputs:
      drill:
        description: "Failure drill: point the download at a dead address (red run, issue, no commit)"
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency: refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv && .venv/bin/pip install -e ".[dev]"
      - name: download and recompute
        id: live
        env:
          BULLWHIP_LIVE_URL: ${{ inputs.drill && 'http://127.0.0.1:9/{sid}' || '' }}
        run: |
          set +e
          .venv/bin/python -m src.bullwhip.live --out report.md
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi
      - name: rebuild the page and run the gate
        if: steps.live.outputs.code == '3'
        run: |
          .venv/bin/python -m src.bullwhip.page
          .venv/bin/playwright install --with-deps chromium
          make gate
      - name: commit
        if: steps.live.outputs.code == '3'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live outputs/live.csv docs/index.html
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          month=$(grep -o 'Latest month every tier has: [0-9-]*' report.md | grep -o '[0-9-]*$')
          test -n "$month" || { echo "report has no latest month"; exit 1; }
          git commit -m "data: monthly Census refresh, live panel through $month"
          git pull --rebase origin main
          git push
      - name: flag a revision of the study window
        if: steps.live.outputs.code == '3'
        run: |
          grep -q '^REVISION:' report.md || exit 0
          title="Census revised the bullwhip study window"
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file report.md; else gh issue create --title "$title" --body-file report.md; fi
      - name: close a failure issue once a run succeeds
        if: success()
        run: |
          n=$(gh issue list --state open --search 'in:title "Monthly refresh failed"' --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue close "$n" --comment "Fixed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; fi
      - name: open or update the failure issue
        if: failure()
        run: |
          title="Monthly refresh failed"
          { echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; echo;
            echo "Nothing was committed. The live panel keeps its last good month."; echo;
            cat report.md 2>/dev/null; } > failure.md
          n=$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body-file failure.md; else gh issue create --title "$title" --body-file failure.md; fi
      - run: cat report.md >> "$GITHUB_STEP_SUMMARY"
        if: always() && hashFiles('report.md') != ''
